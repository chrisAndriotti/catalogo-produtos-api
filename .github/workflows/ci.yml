name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Require dev as the source branch for main
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" != "dev" ] || [ "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]; then
            echo "Pull requests into main must come from the dev branch in this repository."
            exit 1
          fi

      - name: Restore
        run: dotnet restore CatalogoProdutos.slnx

      - name: Build
        run: dotnet build CatalogoProdutos.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test CatalogoProdutos.slnx --configuration Release --no-build
